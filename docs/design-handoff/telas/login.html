<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar · Caderninho de Figurinhas</title>
<script src="../js/theme.js"></script>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/illustrations.css">
<style>
  /* Específico da tela: caderno fechado sobre a mesa */
  .login { min-height: 844px; }
  .notebook {
    position: absolute; left: 18px; right: 18px; top: 196px; bottom: 28px; z-index: 1;
    display: flex; flex-direction: column; gap: 22px; padding: 36px 36px 28px 44px;
    background: #E8D8BF; color: #2B2622;
    border: var(--stroke) solid #2B2622; border-radius: 10px 18px 18px 10px;
    box-shadow: 4px 6px 0 rgba(30, 18, 10, .32);
  }
  .notebook::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(ellipse 260px 200px at 100% 0%, rgba(255, 214, 150, .35), rgba(255, 214, 150, 0) 70%); }
  .notebook__margin { position: absolute; left: 14px; top: 0; bottom: 0; width: 2px; background: rgba(43, 38, 34, .18); }
  .notebook__band { position: absolute; right: 30px; top: -1px; bottom: -1px; width: 12px; background: var(--doghouse); border-left: var(--stroke) solid #2B2622; border-right: var(--stroke) solid #2B2622; }
  .notebook > * { position: relative; }
  .notebook .field__input, .notebook .field__label { color: #2B2622; }
  .notebook .field__input { border-bottom-color: #2B2622; }
  .notebook .field__input::placeholder { color: #6E635A; }
  .label-card { align-self: flex-start; max-width: 250px; padding: 14px 18px 12px; background: #F6EFE3; border: var(--stroke) solid #2B2622; border-radius: 6px; transform: rotate(-1.5deg); box-shadow: 2px 3px 0 rgba(43, 38, 34, .15); }
  .label-card .washi { top: -11px; left: 70px; transform: rotate(4deg); }
</style>
</head>
<body>
<main class="screen login scene-wood">
  <div class="warm-light" aria-hidden="true"></div>
  <div class="light-beam light-beam--flicker" aria-hidden="true" style="top:-60px;left:150px"></div>
  <div class="light-beam" aria-hidden="true" style="top:-60px;left:250px;width:46px;height:460px;opacity:.8"></div>

  <div class="pencil" aria-hidden="true" style="left:20px;top:96px;transform:rotate(-14deg)">
    <i class="pencil__eraser"></i><i class="pencil__ferrule"></i><i class="pencil__body"></i><i class="pencil__tip"></i>
  </div>
  <span class="leaf leaf--copper" aria-hidden="true" style="left:300px;top:20px;transform:rotate(18deg)"></span>
  <span class="leaf leaf--yellow" aria-hidden="true" style="left:196px;top:34px;width:20px;height:20px;transform:rotate(-40deg)"></span>
  <span class="leaf leaf--red" aria-hidden="true" style="left:90px;top:150px;width:22px;height:22px;transform:rotate(70deg)"></span>
  <span class="leaf leaf--orange" aria-hidden="true" style="right:20px;bottom:18px;transform:rotate(-12deg)"></span>
  <span class="leaf leaf--copper" aria-hidden="true" style="left:2px;bottom:60px;width:20px;height:20px;transform:rotate(130deg)"></span>

  <section class="notebook" aria-labelledby="titulo">
    <span class="notebook__margin" aria-hidden="true"></span>
    <span class="notebook__band" aria-hidden="true"></span>

    <div class="label-card">
      <span class="washi" aria-hidden="true"></span>
      <h1 id="titulo" class="display" style="font-size:38px">Caderninho de Figurinhas</h1>
      <p class="small strong" style="margin-top:8px">Snoopy · Um Ano para Recordar · 2026</p>
    </div>

    <form style="display:flex;flex-direction:column;gap:20px;margin-top:4px" action="album.html">
      <label class="field"><span class="field__label">Usuário</span><input class="field__input" type="text" name="usuario" placeholder="seu usuário" autocomplete="username" required></label>
      <label class="field"><span class="field__label">Senha</span><input class="field__input" type="password" name="senha" placeholder="••••••" autocomplete="current-password" required></label>
      <button class="btn btn--primary" type="submit" style="margin:6px 24px 0 0">Entrar</button>
    </form>

    <p class="center" style="margin:auto 24px 0 0">Ainda não tem caderninho? <a href="registro.html" class="strong" style="text-decoration-style:wavy;text-underline-offset:4px">Criar conta</a></p>
  </section>

  <div class="mug-top" aria-hidden="true" style="left:236px;top:58px;z-index:2">
    <span class="mug-top__shadow"></span><span class="mug-top__handle"></span><span class="mug-top__body"></span>
    <span class="puff puff--1"></span><span class="puff puff--2"></span><span class="puff puff--3"></span>
  </div>
</main>
</body>
</html>
