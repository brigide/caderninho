<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grupos · Caderninho de Figurinhas</title>
<script src="../js/theme.js"></script>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/illustrations.css">
</head>
<body>
<div class="screen dots">
  <main class="screen__main" style="padding:16px 24px 24px;gap:22px">
    <h1 class="display-l">Grupos</h1>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center">

      <figure class="polaroid">
        <span class="washi" aria-hidden="true" style="top:-11px;left:50%;margin-left:-40px;height:22px;transform:rotate(3deg)"></span>
        <div class="polaroid__photo" role="img" aria-label="Ilustração: duas canecas fumegantes lado a lado numa mesa de madeira">
          <div class="window-light" aria-hidden="true"></div>
          <div class="frame-pic" aria-hidden="true"></div>
          <div class="tabletop" aria-hidden="true"></div>
          <div class="contact-shadow" aria-hidden="true" style="left:28px;top:104px;width:70px"></div>
          <div class="contact-shadow" aria-hidden="true" style="left:112px;top:106px;width:66px"></div>

          <div class="mug-side" aria-hidden="true" style="left:34px;top:54px">
            <span class="mug-side__handle"></span><span class="mug-side__body"></span><span class="mug-side__rim"></span>
            <span class="wisp" style="left:14px;top:-28px"></span>
            <span class="wisp wisp--r" style="left:26px;top:-32px;animation-delay:1.1s"></span>
            <span class="wisp" style="left:20px;top:-26px;animation-delay:2.1s"></span>
          </div>
          <div class="mug-side mug-side--yellow mug-side--handle-left" aria-hidden="true" style="left:126px;top:60px">
            <span class="mug-side__handle"></span><span class="mug-side__body"><span class="mug-side__band"></span></span><span class="mug-side__rim"></span>
            <span class="wisp wisp--r" style="left:14px;top:-28px;animation-delay:.5s"></span>
            <span class="wisp" style="left:24px;top:-30px;animation-delay:1.7s"></span>
          </div>

          <span class="leaf leaf--copper" aria-hidden="true" style="left:186px;top:112px;width:18px;height:18px;transform:rotate(-30deg)"></span>
          <span class="cookie" aria-hidden="true" style="left:96px;top:118px"></span>
          <div aria-hidden="true" style="position:absolute;inset:0;background:radial-gradient(ellipse 200px 140px at 70% 0%,rgba(255,200,130,.25),rgba(255,200,130,0) 70%),radial-gradient(ellipse 260px 160px at 50% 120%,rgba(30,16,8,.25),rgba(30,16,8,0) 70%)"></div>
        </div>
        <figcaption class="polaroid__caption">a turma começa com dois</figcaption>
      </figure>

      <div style="display:flex;flex-direction:column;gap:8px;max-width:300px">
        <h2 class="display" style="font-size:30px;line-height:1.05">Trocar é mais gostoso em dupla</h2>
        <p>Crie um grupo e convide quem também está colecionando. Vocês veem as repetidas um do outro e o app sugere as trocas.</p>
      </div>
      <button class="btn btn--primary btn--block" type="button">Criar um grupo</button>
      <a class="btn btn--block" href="registro.html">Entrar com código de convite</a>
    </div>
  </main>

  <nav class="tabbar" aria-label="Principal">
    <a class="tabbar__item" href="album.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>Álbum</a>
    <a class="tabbar__item" href="estatisticas.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>Estatísticas</a>
    <a class="tabbar__item" href="grupos.html" aria-current="page"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Grupos</a>
    <a class="tabbar__item" href="#conta"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Conta</a>
  </nav>
</div>
</body>
</html>
