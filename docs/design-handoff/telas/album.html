<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Álbum · Caderninho de Figurinhas</title>
<script src="../js/theme.js"></script>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>
<div class="screen dots" data-album="mobile">
  <header class="album-header">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h1 class="display-l">Meu Álbum</h1>
      <span class="avatar avatar--sm avatar--blue" aria-label="Bruno">B</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span class="small strong">Snoopy · Um Ano para Recordar</span>
        <span class="strong num" data-progress-text>187 / 276 · 68%</span>
      </div>
      <div class="season-bar" role="img" aria-label="Progresso por estação">
        <div class="season-bar__seg"><div class="season-bar__fill fill--spring" data-season-fill="spring"></div></div>
        <div class="season-bar__seg"><div class="season-bar__fill fill--summer" data-season-fill="summer"></div></div>
        <div class="season-bar__seg"><div class="season-bar__fill fill--autumn" data-season-fill="autumn"></div></div>
        <div class="season-bar__seg"><div class="season-bar__fill fill--winter" data-season-fill="winter"></div></div>
      </div>
    </div>
    <div class="chips" role="group" aria-label="Filtrar figurinhas">
      <button type="button" class="chip" data-filter="all">Todas</button>
      <button type="button" class="chip" data-filter="miss">Faltando</button>
      <button type="button" class="chip" data-filter="have">Coladas</button>
      <button type="button" class="chip" data-filter="dup">Repetidas</button>
      <button type="button" class="chip" data-filter="reg">Regular</button>
      <button type="button" class="chip" data-filter="esp">Especial</button>
      <button type="button" class="chip" data-filter="ameba">Ameba</button>
    </div>
    <label class="search">
      <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span class="sr-only">Buscar figurinha por código</span>
      <input type="search" inputmode="numeric" placeholder="Buscar por código (ex.: 12)" data-search>
    </label>
  </header>

  <main style="flex:1;padding:18px 16px 120px;display:flex;flex-direction:column;gap:26px" data-sections></main>

  <a href="envelope.html" class="fab">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
    Abrir envelope
  </a>

  <nav class="tabbar" aria-label="Principal">
    <a class="tabbar__item" href="album.html" aria-current="page"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>Álbum</a>
    <a class="tabbar__item" href="estatisticas.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>Estatísticas</a>
    <a class="tabbar__item" href="grupos.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Grupos</a>
    <a class="tabbar__item" href="#conta"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Conta</a>
  </nav>
</div>
<script src="../js/data.js"></script>
<script src="../js/album.js"></script>
</body>
</html>
