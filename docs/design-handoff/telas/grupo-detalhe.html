<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turma do prédio · Caderninho de Figurinhas</title>
<script src="../js/theme.js"></script>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<style>
  .remove { min-height: 44px; padding: 0 10px; border: none; background: transparent; font-weight: 800; font-size: 14px; color: var(--doghouse-text); cursor: pointer; }
</style>
</head>
<body>
<div class="screen dots">
  <main class="screen__main" style="padding-top:10px;gap:16px">
    <div class="page-head">
      <a href="grupos.html" class="icon-btn icon-btn--bare back" aria-label="Voltar para grupos"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
      <h1 class="display" style="font-size:32px">Turma do prédio</h1>
    </div>

    <a href="trocas.html" class="card card--yellow" style="display:flex;align-items:center;gap:14px;padding:18px 16px;text-decoration:none">
      <span class="icon-btn" aria-hidden="true" style="border-radius:12px;background:#FFFDF7;color:#2B2622;border-color:#2B2622"><svg class="icon icon--sm" viewBox="0 0 24 24"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg></span>
      <span style="flex:1;display:flex;flex-direction:column"><span class="display-s">Trocas com a turma</span><span class="strong" style="font-size:14px">14 trocas possíveis com 3 pessoas</span></span>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </a>

    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="overline">Membros · 4</span>
      <a href="convite.html" class="btn btn--primary btn--sm"><svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>Convidar</a>
    </div>

    <ul class="card card--surface" style="padding:2px 14px">
      <li class="list-row">
        <span class="avatar avatar--blue">B</span>
        <span style="flex:1;display:flex;flex-direction:column"><span class="strong">Bruno <span class="pill pill--tag">dono</span></span><span class="small">68% completo · 134 repetidas</span></span>
      </li>
      <li class="list-row">
        <span class="avatar avatar--pink">A</span>
        <span style="flex:1;display:flex;flex-direction:column"><span class="strong">Ana</span><span class="small">74% completo · 98 repetidas</span></span>
        <button class="remove" type="button" aria-label="Remover Ana do grupo">Remover</button>
      </li>
      <li class="list-row">
        <span class="avatar avatar--orange">L</span>
        <span style="flex:1;display:flex;flex-direction:column"><span class="strong">Léo</span><span class="small">61% completo · 121 repetidas</span></span>
        <button class="remove" type="button" aria-label="Remover Léo do grupo">Remover</button>
      </li>
      <li class="list-row">
        <span class="avatar avatar--green">M</span>
        <span style="flex:1;display:flex;flex-direction:column"><span class="strong">Mari</span><span class="small">39% completo · 22 repetidas</span></span>
        <button class="remove" type="button" aria-label="Remover Mari do grupo">Remover</button>
      </li>
    </ul>

    <button type="button" class="btn btn--ghost btn--sm" style="margin-top:auto;align-self:center">
      <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>Sair do grupo
    </button>
  </main>

  <nav class="tabbar" aria-label="Principal">
    <a class="tabbar__item" href="album.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>Álbum</a>
    <a class="tabbar__item" href="estatisticas.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>Estatísticas</a>
    <a class="tabbar__item" href="grupos.html" aria-current="page"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Grupos</a>
    <a class="tabbar__item" href="#conta"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Conta</a>
  </nav>

</html>
