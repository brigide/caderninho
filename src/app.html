<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#F6EFE3" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#221E1A" media="(prefers-color-scheme: dark)" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Caderninho" />
		<script>
			/* Tema antes do primeiro paint: 'claro' | 'escuro' | 'auto' (padrão) */
			(function () {
				try {
					var t = localStorage.getItem('caderninho:tema') || 'auto';
					var dark =
						t === 'escuro' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
					if (dark) document.documentElement.setAttribute('data-theme', 'dark');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
